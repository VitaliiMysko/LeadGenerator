<!DOCTYPE html>
<html>
  <head>
    <title>Lead generator</title>
    <link rel="stylesheet" href="src/styles/popup.css" />
  </head>
  <body>
    <div class="main-container">
      <div class="container">
        <h3>Lead generator</h3>
        <button id="get-data-button">Get</button>
        <button id="copy">Copy</button>
        <div id="input-container">
          <div class="draggable-input" id="first-name" draggable="true">
            <spam>Name: </spam>
            <input type="text" value="" />
          </div>
          <div class="draggable-input" id="second-name" draggable="true">
            <spam>Surname: </spam>
            <input type="text" value="" />
          </div>
          <div class="draggable-input" id="job-position" draggable="true">
            <spam>Job position: </spam>
            <input type="text" id="job-position-input" value="" />
            <button id="translate-btn">
              <img src="assets/icons/google-translate-16.png" alt="Translate icon" />
            </button>
          </div>
          <div class="draggable-input" id="link" draggable="true">
            <spam>Link: </spam>
            <input type="text" value="" />
          </div>
          <div class="draggable-input" id="email" draggable="true">
            <spam>Email: </spam>
            <input type="email" value="" />
          </div>
          <div class="draggable-input" id="company-name" draggable="true">
            <spam>Company name: </spam>
            <input type="text" value="" />
          </div>
        </div>
        <div id="info" class="info"></div>
      </div>

      <div class="vertical-line"></div>

      <div class="container">
        <h3>Companies</h3>
        <div id="radio-list-container"></div>
      </div>
    </div>

    <script src="src/scripts/popup.js"></script>
    <script src="src/scripts/translation.js"></script>
    <script src="src/scripts/drag-and-drop.js"></script>
    <script src="libs/transliteration/bundle.umd.min.js"></script>
  </body>
</html>
