<!doctype html>
<html>
  <head>
    <title>Lead generator</title>
    <link rel="stylesheet" href="src/styles/main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="version-container">
      <span id="app-version"></span>
    </div>
    <div class="main-container">
      <div class="container">
        <h3>Lead generator</h3>
        <button id="get-btn">Get</button>
        <button id="copy-btn">Copy</button>
        <div id="data-container">
          <div class="draggable-block">
            <span>Name: </span>
            <input type="text" id="first-name" value="" />
          </div>
          <div class="draggable-block">
            <span>Surname: </span>
            <input type="text" id="second-name" value="" />
          </div>
          <div class="draggable-block" id="job-position-block">
            <span>Job position: </span>
            <input type="text" id="job-position" value="" />
            <button id="translate-btn">
              <img
                src="assets/icons/google-translate-16.png"
                alt="Translate icon"
                title="Translate"
              />
            </button>
          </div>
          <div class="draggable-block">
            <span>Link: </span>
            <input type="text" id="link" value="" />
          </div>
          <div class="draggable-block" id="email-block">
            <span>Email: </span>
            <input type="email" id="email" value="" />
            <button id="validete-emails-btn" style="right: 23px">
              <img
                src="assets/icons/validate-email-16.png"
                alt="Validate email icon"
                title="Validate email"
              />
            </button>
            <button id="generate-emails-btn">
              <img
                src="assets/icons/generate-emails-16.png"
                alt="Generate emails icon"
                title="Generate emails"
              />
            </button>
          </div>
          <div class="draggable-block">
            <span>Company name: </span>
            <input type="text" id="company-name" value="" />
          </div>
          <div class="draggable-block">
            <span>Country:</span>
            <input type="text" id="company-country" value="" />
          </div>
          <div class="draggable-block">
            <span>Industry:</span>
            <input type="text" id="company-industry" value="" />
          </div>
        </div>
        <div id="alert" class="alert"></div>
      </div>
      <div class="vertical-line"></div>
      <div class="container tabs-container">
        <div class="tab-selector">
          <div class="tab-selector-trigger">
            <span id="selected-tab"><h3>Actual experience</h3></span>
            <span class="arrow"></span>
          </div>
          <div class="tab-dropdown">
            <div class="tab-option active" data-tab="experience">
              Actual experiece
            </div>
            <div class="tab-option" data-tab="filters">Filters</div>
            <div class="tab-option" data-tab="settings">Settings</div>
            <div class="tab-option" data-tab="login">Log in / Sign up</div>
          </div>
        </div>
        <div class="tabs-content">
          <div id="tab-experience" class="tab active">
            <div id="experience-container"></div>
          </div>
          <div id="tab-filters" class="tab">
            <input type="text" placeholder="Filter by company" />
            <input type="text" placeholder="Filter by industry" />
            <input type="text" placeholder="Filter by country" />
          </div>
          <div id="tab-settings" class="tab">
            <label>
              <input id="drag-and-drop-settings" type="checkbox" />
              using "Drag & drop"
            </label>
          </div>
          <div id="tab-login" class="tab">
            <span>Test test: </span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="src/scripts/main.js"></script>
    <script
      type="module"
      src="src/scripts/containers/data/get-data.js"
    ></script>
    <script
      type="module"
      src="src/scripts/containers/data/copy-data.js"
    ></script>
    <script
      type="module"
      src="src/scripts/containers/data/drag-and-drop-data.js"
    ></script>
    <script
      type="module"
      src="src/scripts/containers/navigation/tab-selector.js"
    ></script>
    <script
      type="module"
      src="src/scripts/containers/settings/settings.js"
    ></script>
    <script type="module" src="src/scripts/services/translation.js"></script>
    <script src="libs/transliteration/bundle.umd.min.js"></script>
  </body>
</html>
