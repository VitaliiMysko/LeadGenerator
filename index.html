<!doctype html>
<html>
  <head>
    <title>Lead generator</title>
    <link rel="stylesheet" href="src/styles/main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="version-container">
      <span id="app-version"></span>
    </div>
    <div class="main-container">
      <div class="container">
        <h3>LEAD GENERATOR</h3>
        <div class="button-row">
          <button id="extract-btn">Extract</button>
          <button id="save-btn" disabled>Save</button>
        </div>
        <hr class="buttons-divider" />
        <div class="button-row">
          <button id="get-storage-leads-btn" class="btn-progress">
            <span>Get</span>
            <span class="get-counter">
              <span class="get-counter-current">0</span>
              <span class="get-counter-slash"></span>
              <span class="get-counter-max"></span>
            </span>
          </button>
          <button id="clean-btn" class="btn-secondary">Clean</button>
        </div>
        <div id="data-container">
          <div class="draggable-block">
            <span>Name</span>
            <input type="text" id="first-name" value="" />
          </div>
          <div class="draggable-block">
            <span>Surname</span>
            <input type="text" id="second-name" value="" />
          </div>
          <div class="draggable-block" id="job-position-block">
            <span>Job position</span>
            <div class="field-input-wrap">
              <input type="text" id="job-position" value="" />
              <button id="translate-btn">
                <img
                  src="assets/icons/google-translate-16.png"
                  alt="Translate icon"
                  title="Translate"
                />
              </button>
            </div>
          </div>
          <div class="draggable-block">
            <span>Link</span>
            <input type="text" id="link" value="" />
          </div>
          <div class="draggable-block" id="email-block">
            <span>Email</span>
            <div class="field-input-wrap">
              <input type="email" id="email" value="" />
              <button id="validate-emails-btn" disabled>
                <img
                  src="assets/icons/validate-email-16.png"
                  alt="Validate email icon"
                  title="Validate email"
                />
              </button>
              <button id="generate-emails-btn" disabled>
                <img
                  src="assets/icons/generate-emails-16.png"
                  alt="Generate emails icon"
                  title="Generate emails"
                />
              </button>
            </div>
          </div>
          <div class="draggable-block" id="company-name-block">
            <span>Company name</span>
            <div class="field-input-wrap">
              <input type="text" id="company-name" value="" />
              <button id="open-company-linkedin-btn" disabled>
                <img
                  src="assets/icons/linkedin-16.png"
                  alt="LinkedIn icon"
                  title="Open company LinkedIn page"
                />
              </button>
            </div>
          </div>
          <div class="draggable-block">
            <span>Country</span>
            <input type="text" id="company-country" value="" />
          </div>
          <div class="draggable-block">
            <span>Industry</span>
            <input type="text" id="company-industry" value="" />
          </div>
        </div>
        <div id="alert" class="alert"></div>
        <div id="confirm-dialog" class="confirm-overlay" style="display:none">
          <div class="confirm-box">
            <p id="confirm-message"></p>
            <div class="button-row">
              <button id="confirm-ok">OK</button>
              <button id="confirm-cancel" class="btn-secondary">Cancel</button>
            </div>
          </div>
        </div>
      </div>
      <div class="vertical-line"></div>
      <div class="container tabs-container">
        <div class="tab-selector">
          <div class="tab-selector-trigger">
            <span id="selected-tab"><h3>Actual experience</h3></span>
            <span class="arrow"></span>
          </div>
          <div class="tab-dropdown">
            <div class="tab-option active" data-tab="experience">
              Actual experience
            </div>
            <div class="tab-option" data-tab="filters">Filters</div>
            <div class="tab-option" data-tab="settings">Settings</div>
          </div>
        </div>
        <div class="tabs-content">
          <div id="tab-experience" class="tab active"></div>
          <div id="tab-filters" class="tab">
            <div class="tab-item-block">
              <label>Company headquarters location:</label>
              <div class="multi-select-tags" id="company-location-filter">
                <div class="tags-container"></div>
                <input
                  type="text"
                  class="multi-input"
                  placeholder="Select location..."
                />
                <div class="dropdown"></div>
              </div>
            </div>
            <div class="tab-item-block">
              <label>Company size:</label>
              <div class="multi-select-tags" id="company-size-filter">
                <div class="tags-container"></div>
                <input
                  type="text"
                  class="multi-input"
                  placeholder="Select size..."
                />
                <div class="dropdown"></div>
              </div>
            </div>
          </div>
          <div id="tab-settings" class="tab">
            <div class="tab-item-block">
              <input
                id="drag-and-drop-settings"
                type="checkbox"
                title="Enable / disable drag-and-drop field reordering"
              />Drag-and-drop
            </div>
            <div class="tab-item-block">
              <input
                id="transliteration-settings"
                type="checkbox"
                title="Enable / disable individual's names transliteration"
              />Transliteration
            </div>
            <div class="tab-item-block">
              <input
                id="field-order-settings"
                type="checkbox"
                title="Remember and restore the last field order after reopening the extension"
              />Remember field order
            </div>
            <div class="tab-item-block">
              <input
                id="country-by-default-settings"
                type="checkbox"
                title="Use a fixed default country when location cannot be determined"
              />Country by default
            </div>
            <div class="tab-item-block" id="country-by-default-wrapper" style="display:none">
              <div class="single-select" id="country-by-default-select">
                <input
                  type="text"
                  class="single-input"
                  placeholder="Type or select country..."
                />
                <div class="dropdown"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="src/scripts/main.js"></script>
    <script
      type="module"
      src="src/scripts/containers/data/extract-data.js"
    ></script>
    <script
      type="module"
      src="src/scripts/containers/data/open-company-linkedin.js"
    ></script>
    <script
      type="module"
      src="src/scripts/containers/navigation/tab-selector.js"
    ></script>
    <script type="module" src="src/scripts/services/translation.js"></script>
    <script src="libs/transliteration/bundle.umd.min.js"></script>
  </body>
</html>
